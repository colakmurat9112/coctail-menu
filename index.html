<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modern Classics · Kokteyl Kitabı</title>
<meta name="description" content="Terpen eşleşmeli, pre-batch, operasyonel modern klasik kokteyller ve ev hazırlıkları.">
<meta name="theme-color" content="#100e0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Modern Classics">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root {
  /* Mixology Handbook ile aynı dil: isli meşe zemin, pirinç vurgu, campari ikincil. Terpen Matrix ek olarak molekül aile renkleri kullanır. */
  --bg: #100e0d;
  --surface: #191614;
  --surface-2: #231e1b;
  --line: #342c27;
  --text: #ede5da;
  --muted: #a69888;
  --accent: #d6a75c;
  --accent-ink: #1a1408;
  --accent-soft: rgba(214, 167, 92, 0.12);
  --red: #c8553d;
  --red-soft: rgba(200, 85, 61, 0.14);
  --blue: #86a9c6;
  --blue-soft: rgba(134, 169, 198, 0.12);
  --green: #8fb07a;
  --green-soft: rgba(143, 176, 122, 0.14);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
  --sidebar: 290px;
  --bottom-nav: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100%; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--text); padding: 0 6px; }
.brand-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.brand-title { font-family: var(--font-display); font-size: 21px; line-height: 1.15; }
.search-box { position: relative; }
.search-box input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px 9px 34px; font-size: 14px; }
.search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 8px 6px; }
.nav-item { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 14.5px; line-height: 1.3; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-no { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.nav-item.active .nav-no { color: var(--accent); }
.nav-sub { font-size: 12px; color: var(--muted); display: block; }
.nav-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.side-foot { margin-top: auto; padding: 0 8px; font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
.main { min-width: 0; }
.content { max-width: 980px; margin: 0 auto; padding: 36px 32px 96px; }
.topbar, .bottom-nav, .scrim { display: none; }

/* ---------- Headers ---------- */
.sec-head { display: flex; flex-direction: column; gap: 12px; padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.sec-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sec-kicker .num { color: var(--accent); }
.sec-head h1 { font-size: clamp(28px, 5vw, 42px); }
.sec-head h1 em { font-style: normal; color: var(--muted); font-weight: 400; font-size: .5em; display: block; margin-top: 6px; font-family: var(--font-body); }
.lead { font-size: 17px; color: #d8cfc3; max-width: 70ch; margin: 0; }
.crumb { font-size: 13px; color: var(--muted); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.crumb:hover { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-family: var(--font-mono); letter-spacing: .03em; border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
.pill.accent { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.pill.green { border-color: transparent; background: var(--green-soft); color: var(--green); }
.pill.red { border-color: transparent; background: var(--red-soft); color: #ec8a72; }
.pill.blue { border-color: transparent; background: var(--blue-soft); color: var(--blue); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 500; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on { background: var(--green); border-color: var(--green); color: #10140c; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.danger:hover { border-color: var(--red); color: #ec8a72; }
.btn svg { width: 16px; height: 16px; }

.chips { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; margin-bottom: 8px; background: linear-gradient(var(--bg) 80%, transparent); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 14px; }
.tools input[type=search], .tools select { flex: 1 1 200px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- Blocks ---------- */
.block { padding: 24px 0 6px; }
.block > h2 { font-size: 22px; margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.block > h2 .bn { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 400; letter-spacing: .06em; }
.block > h2 small { font-family: var(--font-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.prose { max-width: 72ch; }
.prose p { margin: 0 0 12px; }
.prose b { color: #fff6e8; font-weight: 600; }
.note { border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); max-width: 80ch; }
.note .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.note.tip { border-color: rgba(214,167,92,.35); background: var(--accent-soft); } .note.tip .tag { color: var(--accent); }
.note.warn { border-color: rgba(200,85,61,.45); background: var(--red-soft); } .note.warn .tag { color: #ec8a72; }
.note.science { border-color: rgba(134,169,198,.4); background: var(--blue-soft); } .note.science .tag { color: var(--blue); }
.note.ok { border-color: rgba(143,176,122,.4); background: var(--green-soft); } .note.ok .tag { color: var(--green); }
.note p { margin: 0 0 8px; } .note p:last-child { margin: 0; }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 78ch; }
.tips li { padding: 9px 14px; border-left: 2px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font-size: 14.5px; }
.tips.red li { border-left-color: var(--red); }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 76ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; font-size: 14.5px; }
.steps li::before { content: counter(s); font-family: var(--font-mono); font-size: 12px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.kv div { background: var(--surface); padding: 10px 14px; font-size: 14px; }
.kv span { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.box h3 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
.box p { margin: 0; font-size: 14.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.tags .pill { white-space: normal; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td { font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }

/* ---------- Molecule visuals ---------- */
.mol { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12.5px; text-decoration: none; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.mol i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.mol.diger i { border-radius: 2px; transform: rotate(45deg); width: 7px; height: 7px; }
.mol:hover { border-color: var(--c, var(--accent)); }
.typebadge { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; }
.typebadge.terpen { background: var(--green-soft); color: var(--green); }
.typebadge.diger { background: var(--blue-soft); color: var(--blue); }
.fp { display: grid; gap: 7px; }
.fp-row { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 44px; gap: 10px; align-items: center; font-size: 13.5px; text-decoration: none; color: var(--text); }
.fp-row:hover .fp-name { color: var(--accent); }
.fp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.fp-name i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.fp-row.diger .fp-name i { border-radius: 2px; transform: rotate(45deg); width: 7px; height: 7px; }
.fp-bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.fp-bar > b { display: block; height: 100%; background: var(--c); border-radius: 5px; }
.fp-row.diger .fp-bar > b { background: repeating-linear-gradient(135deg, var(--c) 0 5px, color-mix(in srgb, var(--c) 55%, transparent) 5px 8px); }
.fp-val { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.stack > i { display: block; height: 100%; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.legend i.sq { border-radius: 2px; transform: rotate(45deg); width: 8px; height: 8px; }

/* ---------- Cards / lists ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--text); position: relative; min-width: 0; }
a.card:hover, button.card:hover { border-color: var(--accent); }
.card h3 { font-family: var(--font-body); font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.card .sub { font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); }
.card .txt { font-size: 13.5px; color: #d8cfc3; }
.card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card .tags .mol { font-size: 11.5px; }
.inbar { position: absolute; top: 10px; right: 10px; font-family: var(--font-mono); font-size: 10.5px; color: var(--green); }
.rank { display: grid; gap: 6px; }
.ritem { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--text); }
.ritem:hover { border-color: var(--accent); }
.ritem .nm { font-weight: 500; font-size: 14.5px; line-height: 1.3; }
.ritem .ds { font-size: 12.5px; color: var(--muted); }
.ritem .bd { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

/* Score */
.score { --v: 50; --c: var(--accent); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--v) * 1%), var(--surface-2) 0); position: relative; flex: none; }
.score::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
.score b { position: relative; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.score.big { width: 120px; height: 120px; }
.score.big::before { inset: 9px; background: var(--bg); }
.score.big b { font-size: 30px; }
.score.big small { position: relative; display: block; font-size: 10px; color: var(--muted); font-family: var(--font-mono); text-align: center; letter-spacing: .08em; }
.sc-hi { --c: var(--green); } .sc-mid { --c: var(--accent); } .sc-lo { --c: #e08a4f; } .sc-bad { --c: var(--red); }
.kind { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; }
.kind.kopru { background: var(--green-soft); color: var(--green); }
.kind.kontrast { background: var(--blue-soft); color: var(--blue); }
.kind.dikkat { background: var(--red-soft); color: #ec8a72; }
.mode { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); }
.mode.mix { color: var(--green); border-color: rgba(143,176,122,.4); }
.mode.infuse { color: #c4a5e0; border-color: rgba(196,165,224,.4); }
.mode.hybrid { color: var(--accent); border-color: rgba(214,167,92,.4); }
.style { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: #d8cfc3; border: 1px solid var(--line); }
.pair-names { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; font-size: 15px; }
.pair-names .plus { color: var(--accent); font-family: var(--font-mono); font-weight: 400; }

/* Pair hero */
.pair-hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.pair-hero h2 { font-size: clamp(22px, 4vw, 30px); }
.pair-hero .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.pair-hero .profile { margin-top: 10px; color: #d8cfc3; font-size: 15.5px; }
.scorepair { display: grid; gap: 8px; justify-items: center; }
.scorepair .f { font-size: 12px; color: var(--muted); font-family: var(--font-mono); text-align: center; }
.bond-list { display: grid; gap: 8px; }
.bond { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.bond > span:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.bond .arrow { color: var(--muted); margin: 0 2px; }
.bond .share { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }

/* Recipe */
.recipe { border: 1px solid rgba(214,167,92,.35); border-radius: 14px; background: linear-gradient(180deg, #1d1915, var(--surface)); overflow: hidden; max-width: 780px; }
.recipe-head { padding: 16px 18px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.recipe-head h3 { font-size: 22px; }
.recipe-kind { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; display: block; }
.recipe-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.recipe-meta div { background: var(--surface); padding: 9px 18px; font-size: 13.5px; }
.recipe-meta span { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ing { list-style: none; margin: 0; padding: 12px 18px; }
.ing li { display: grid; grid-template-columns: 78px 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; align-items: baseline; }
.ing li:last-child { border-bottom: 0; }
.ing .amt { font-family: var(--font-mono); color: var(--accent); font-size: 13px; }
.ing .have { font-family: var(--font-mono); font-size: 10.5px; color: var(--green); }
.ing .miss { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.recipe-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 14px; }
.recipe-foot b { color: var(--accent); font-weight: 500; }

/* Forms / calculators */
.calc { border: 1px solid rgba(134,169,198,.35); background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.calc-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--muted); }
.field input, .field select, .inp { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-family: var(--font-mono); font-size: 15px; width: 100%; min-width: 0; }
.field select, select.inp { font-family: var(--font-body); font-size: 14px; }
.inp.sm { padding: 6px 8px; font-size: 13.5px; }
.results { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.res { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.res span { display: block; font-size: 12px; color: var(--muted); }
.res strong { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.res.hl strong { color: var(--accent); }
.res.good strong { color: var(--green); }
.res.bad strong { color: #ec8a72; }
.rows-table td, .rows-table th { padding: 6px 8px; }
.rows-table input, .rows-table select { width: 100%; }
.rows-table .num { width: 84px; }
.calc-note { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.warnlist { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.warnlist li { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; background: var(--red-soft); border: 1px solid rgba(200,85,61,.35); }
.warnlist li.info { background: var(--blue-soft); border-color: rgba(134,169,198,.35); }
input[type=range] { accent-color: var(--accent); width: 100%; }

/* Matrix heatmap */
.matrix { border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.matrix th { background: none; font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--muted); padding: 4px; max-width: 110px; white-space: normal; line-height: 1.2; vertical-align: bottom; }
.matrix th.rowh { text-align: right; vertical-align: middle; }
.matrix td { width: 52px; height: 40px; text-align: center; vertical-align: middle; border-radius: 6px; font-family: var(--font-mono); padding: 0; border: 0; }
.matrix td a { display: grid; place-items: center; width: 100%; height: 100%; color: inherit; text-decoration: none; border-radius: 6px; }
.matrix td a:hover { outline: 2px solid var(--accent); }
.matrix td.self { background: var(--surface-2); color: var(--muted); }

/* Decision tree */
.dtree { display: grid; gap: 10px; counter-reset: q; max-width: 820px; }
.dq { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.dq .q { font-weight: 600; }
.dq .q::before { counter-increment: q; content: "S" counter(q) " · "; font-family: var(--font-mono); color: var(--accent); font-weight: 400; }
.dq .ans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; }
.dq .ans div { padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.dq .ans b { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; display: block; }
.dq .ans .y b { color: var(--green); } .dq .ans .n b { color: var(--muted); }
.gcard { border-left: 4px solid var(--c); }

/* Home */
.hero { display: grid; gap: 14px; padding: 8px 0 26px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(30px, 6vw, 52px); max-width: 18ch; }
.hero p { max-width: 66ch; color: #d8cfc3; font-size: 17px; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 20px 0 6px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-decoration: none; color: var(--text); }
.stat strong { display: block; font-family: var(--font-mono); font-size: 24px; font-weight: 500; color: var(--accent); }
.stat span { font-size: 13px; color: var(--muted); }
.quick { position: relative; max-width: 640px; }
.quick input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 17px; }
.qres { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 360px; overflow-y: auto; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.qres a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line); font-size: 14.5px; }
.qres a:last-child { border-bottom: 0; }
.qres a:hover, .qres a.sel { background: var(--surface-2); }
.qres .w { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.section-title { font-size: 22px; margin: 32px 0 4px; }
.sres { display: grid; gap: 8px; margin-top: 12px; }
.sitem { display: block; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
.sitem:hover { border-color: var(--accent); }
.sitem .where { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.sitem .lbl { font-weight: 600; margin: 2px 0; }
.sitem .snip { font-size: 13.5px; color: var(--muted); }
mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px; }

/* Bar inventory */
.inv { display: grid; gap: 6px; }
.inv-row { display: grid; grid-template-columns: 28px 1fr 110px; gap: 10px; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.inv-row input[type=checkbox] { accent-color: var(--green); width: 18px; height: 18px; }
.inv-row .nm { font-size: 14.5px; line-height: 1.3; }
.inv-row .nm small { display: block; color: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.inv-row .price { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.molrow { display: grid; grid-template-columns: 1fr 90px 36px; gap: 8px; align-items: center; margin-bottom: 6px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.offline-pill { display: none; }
body.offline .offline-pill { display: inline-flex; }

/* ---------- Mobile ---------- */
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: min(86vw, 320px); height: 100%; transform: translateX(-102%); transition: transform .25s ease; padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: calc(var(--bottom-nav) + 20px + env(safe-area-inset-bottom)); }
  .sidebar.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(16,14,13,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar .t { font-family: var(--font-display); font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .content { padding: 18px 16px calc(var(--bottom-nav) + 40px + env(safe-area-inset-bottom)); }
  .chips { top: calc(54px + env(safe-area-inset-top)); }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: rgba(25,22,20,.97); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--bottom-nav); font-size: 11px; color: var(--muted); text-decoration: none; }
  .bottom-nav svg { width: 22px; height: 22px; }
  .bottom-nav .on { color: var(--accent); }
  .toast { bottom: calc(var(--bottom-nav) + 16px + env(safe-area-inset-bottom)); }
  .two { grid-template-columns: 1fr; }
  .pair-hero { grid-template-columns: 1fr; justify-items: start; }
  .scorepair { justify-items: start; grid-template-columns: auto 1fr; align-items: center; gap: 14px; }
  .dq .ans { grid-template-columns: 1fr; }
  .bond { grid-template-columns: 1fr; gap: 4px; }
  .ing li { grid-template-columns: 70px 1fr auto; }
  th, td { padding: 8px 10px; font-size: 13.5px; }
}
@media (max-width: 680px) {
  .rows-table tr:first-child { display: none; }
  .rows-table, .rows-table tbody { display: block; }
  .rows-table tr[data-i] { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 40px; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); align-items: center; }
  .rows-table tr[data-i]:last-child { border-bottom: 0; }
  .rows-table td { padding: 0; border: 0; min-width: 0; }
  .rows-table td:first-child { grid-column: 1 / -1; }
  .rows-table td:has(select[data-f=ref]) { grid-column: 1 / -2; }
  .rows-table .num { width: 100%; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .fp-row { grid-template-columns: 112px 1fr 36px; gap: 8px; }
  .ritem { grid-template-columns: 46px 1fr; }
  .ritem .bd { grid-column: 2; justify-content: flex-start; }
  .score.big { width: 96px; height: 96px; } .score.big b { font-size: 24px; }
  .inv-row { grid-template-columns: 26px 1fr; }
  .inv-row .price { grid-column: 2; }
  .matrix td { width: 40px; height: 34px; font-size: 11px; }
  .matrix th { max-width: 72px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- Kokteyl Kitabı ekleri ---------- */
.formula { border: 1px solid rgba(214,167,92,.35); border-radius: 16px; background: linear-gradient(180deg, #1d1915, var(--surface)); overflow: hidden; max-width: 820px; }
.formula-head { padding: 18px 20px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.formula-head h2 { font-size: clamp(24px, 5vw, 32px); }
.formula-head .de { font-size: 14.5px; color: #d8cfc3; font-style: italic; margin-top: 6px; }
.formula-head .kick { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 6px; }
.fmeta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.fmeta div { background: var(--surface); padding: 11px 20px; font-size: 14.5px; }
.fmeta span { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.fsec { padding: 14px 20px 16px; border-bottom: 1px solid var(--line); }
.fsec:last-child { border-bottom: 0; }
.fsec h4 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 500; }
.ingl { list-style: none; margin: 0; padding: 0; }
.ingl li { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; align-items: baseline; }
.ingl li:last-child { border-bottom: 0; }
.ingl .amt { font-family: var(--font-mono); color: var(--accent); font-size: 14px; }
.ingl .tag2 { font-family: var(--font-mono); font-size: 10.5px; color: var(--blue); white-space: nowrap; }
.ingl a { color: inherit; text-decoration-color: rgba(214,167,92,.5); text-underline-offset: 3px; }
.ingl .prep-link { color: var(--accent); }
.ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; }
.serve { font-size: 15px; display: grid; gap: 6px; }
.serve b { color: var(--accent); font-weight: 500; }
.cost-big { font-family: var(--font-mono); font-size: 22px; color: var(--text); }
.stars { display: inline-flex; gap: 4px; }
.stars button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 18px; color: var(--muted); display: grid; place-items: center; padding: 0; }
.stars button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.status { display: flex; flex-wrap: wrap; gap: 8px; }

.status button.on.menu { background: var(--green); border-color: var(--green); color: #10140c; }
.status button.on.revize { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.status button.on.elendi { background: var(--red); border-color: var(--red); color: #fff; }
textarea.inp { font-family: var(--font-body); font-size: 15px; min-height: 90px; resize: vertical; line-height: 1.5; }
.stpill { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 7px; border-radius: 4px; }
.stpill.menu { background: var(--green-soft); color: var(--green); }
.stpill.revize { background: var(--accent-soft); color: var(--accent); }
.stpill.elendi { background: var(--red-soft); color: #ec8a72; }
.fmtpill { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--blue); }
.ccard .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.ccard .de { font-size: 13px; color: var(--muted); font-style: italic; }
.ccard .ings { font-size: 13px; color: #d8cfc3; }
.ccard .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; margin-top: auto; }
.mini-stars { font-size: 12px; color: var(--accent); letter-spacing: 1px; }
.seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg2 button { border: 0; background: var(--surface); padding: 8px 14px; font-size: 14px; color: var(--muted); }
.seg2 button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.load { display: grid; gap: 6px; }
.load .bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.load .bar > i { display: block; height: 100%; background: var(--green); }
.load .bar.over > i { background: var(--red); }
.price-row { display: grid; grid-template-columns: 1fr 96px 70px; gap: 8px; align-items: center; padding: 7px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.price-row small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.storage { font-family: var(--font-mono); font-size: 12px; }
@media (max-width: 520px) {
  .ingl li { grid-template-columns: 74px 1fr; }
  .ingl li .tag2 { grid-column: 2; }
  .fmeta div { padding: 10px 14px; }
  .fsec, .formula-head { padding-left: 14px; padding-right: 14px; }
  .price-row { grid-template-columns: 1fr 86px; }
  .price-row .unit { display: none; }
}
